<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GooseAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.responsivevoice.org/sdk/latest/responsivevoice.js"></script>
  <script>
responsiveVoice.init({
    "apiKey": "2GQnsRRq"
});
  </script>
  <style>
    :root {
      --bg: #15131f;
      --bg-gradient: linear-gradient(135deg, #241a44 0%, #15131f 48%, #0e1a33 100%);
      --sidebar-bg: #1b1828;
      --surface: #221e30;
      --surface-hover: #2c2740;
      --border: #3a3357;
      --text: #f4f0fb;
      --text-secondary: #b4a9cf;
      --brand: #bb00ff;
      --brand-soft: rgba(187, 0, 255, 0.18);
      --danger: #ef4444;
      --radius: 18px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --surface-rgb: 34,30,48;
      --acrylic-sidebar: rgba(42,36,62,0.15);
      --acrylic-panel: rgba(42,36,62,0.10);
      --acrylic-header: rgba(42,36,62,0.09);
      --acrylic-input: rgba(42,36,62,0.12);
      --acrylic-bubble: rgba(42,36,62,0.08);
      --acrylic-bar: rgba(42,36,62,0.06);
    }
    html[data-theme="light"] {
      --bg: #e9ebf2;
      --bg-gradient: linear-gradient(135deg, #efeafb 0%, #e9ebf2 50%, #e2eaf6 100%);
      --sidebar-bg: #e1e4ee;
      --surface: #ffffff;
      --surface-hover: #f1f2f8;
      --border: #d4d8e4;
      --text: #232233;
      --text-secondary: #6d6a82;
      --surface-rgb: 255,255,255;
      --acrylic-sidebar: rgba(255,255,255,0.3);
      --acrylic-panel: rgba(255,255,255,0.22);
      --acrylic-header: rgba(255,255,255,0.2);
      --acrylic-input: rgba(255,255,255,0.28);
      --acrylic-bubble: rgba(255,255,255,0.18);
      --acrylic-bar: rgba(255,255,255,0.18);
    }

    /* 主题切换过渡 */
    html.theme-anim, html.theme-anim * {
      transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease !important;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
    }
    #app {
      position: relative;
      z-index: 1;
    }
    /* 流体背景 */
    #fluidCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 侧边栏 */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--acrylic-sidebar);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      transition: width .25s ease;
    }
    .sidebar.collapsed {
      width: 0;
      padding: 0;
      border-right: none;
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      color: var(--brand);
      user-select: none;
    }
    .logo img {
      height: 26px;
      width: auto;
      flex-shrink: 0;
    }

    .logo svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .icon-btn:active { transform: scale(0.96); }

    .new-chat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .new-chat:hover { background: var(--surface-hover); border-color: var(--border); }
    .new-chat:active { transform: scale(0.98); }

    .agent-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 10px 0; margin-top: 8px;
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: transparent; color: var(--text-secondary);
      font-size: 14px; text-decoration: none; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .agent-btn:hover { background: var(--surface-hover); color: var(--text); }

    .history {
      flex: 1;
      overflow-y: auto;
      margin-top: 18px;
      padding-right: 2px;
    }

    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .history { scrollbar-width: none; }
    .history::-webkit-scrollbar { display: none; }

    .group { margin-bottom: 18px; }
    .group-title {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 8px 8px;
      user-select: none;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
      overflow: hidden;
    }

    .chat-item:hover { background: var(--surface-hover); }
    .chat-item.active { background: var(--surface); }

    .chat-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-more {
      opacity: 0;
      color: var(--text-secondary);
      transition: opacity .15s;
    }

    .chat-item:hover .chat-more { opacity: 1; }

    .chat-pin {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; flex: 0 0 auto;
      margin-right: 6px; padding: 0;
      border: none; background: transparent; border-radius: 6px;
      color: var(--text-secondary); cursor: pointer;
      transition: color .15s, background .15s;
    }
    .chat-pin:hover { background: var(--surface-hover); color: var(--text); }
    .chat-pin.pinned { color: var(--brand); }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; margin: 0 auto 6px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-secondary); cursor: pointer;
      font-size: 16px; transition: background .15s, color .15s;
    }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); }
    .theme-icon { display: flex; align-items: center; justify-content: center; }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 6px;
      border-top: 1px solid var(--border);
      margin-top: auto;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background .15s;
    }

    .user-bar:hover { background: var(--surface-hover); }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #bb00ff, #7a00cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .user-name {
      flex: 1;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 主区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .mobile-header .logo { font-size: 16px; }

    .chat-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 24px;
      overflow: hidden;
      scrollbar-width: none;
      background: var(--acrylic-panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .chat-center::-webkit-scrollbar { display: none; }

    /* 右栏：文件面板 */
    .right-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--acrylic-panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .25s ease, border-left .25s ease;
    }
    .right-panel-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .right-tab {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
    }
    .right-tab.active {
      color: var(--brand);
    }
    .right-panel-count {
      color: var(--text-secondary);
      font-size: 11px;
    }
    .right-panel-body {
      flex: 1;
      overflow-y: auto;
    }
    .right-panel.hidden { display: none; }
    .right-panel.collapsed {
      width: 0;
      border-left: none;
      overflow: hidden;
    }
    .right-panel.collapsed .right-tab,
    .right-panel.collapsed .right-panel-count,
    .right-panel.collapsed .right-panel-body { display: none; }

    /* ===== GooseHost 部署区 ===== */
    .deploy-bar {
      position: sticky; top: 0; z-index: 2;
      padding: 8px 12px;
      background: var(--acrylic-panel);
      border-bottom: 1px solid var(--border);
    }
    .deploy-toggle {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--brand);
      background: rgba(187, 0, 255, .12);
      color: var(--brand);
      border-radius: var(--radius-sm);
      cursor: pointer; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s;
    }
    .deploy-toggle:hover { background: rgba(187, 0, 255, .22); }
    .deploy-panel {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .gh-login { display: flex; flex-direction: column; gap: 6px; }
    .gh-login-row { display: flex; gap: 6px; align-items: center; }
    .gh-login-row .gh-input { flex: 1; min-width: 0; }
    .gh-login-row .gh-btn { flex-shrink: 0; white-space: nowrap; }
    .gh-tip { font-size: 12px; color: var(--text-secondary); margin: 0; line-height: 1.5; }
    .gh-input {
      width: 100%; padding: 6px 8px;
      box-sizing: border-box;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text); font-size: 12px;
    }
    .gh-input:focus { outline: none; border-color: var(--brand); }
    .gh-btn {
      padding: 7px 10px; border: none; border-radius: var(--radius-sm);
      background: var(--brand); color: #fff; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: background .15s;
    }
    .gh-btn:hover { background: #9d00d6; }
    .gh-btn:disabled { opacity: .5; cursor: not-allowed; }
    .gh-link {
      background: none; border: none; color: var(--brand);
      font-size: 12px; cursor: pointer; padding: 0; text-align: left;
    }
    .gh-user { font-size: 12px; color: var(--text-secondary); }
    .gh-user a { color: var(--brand); cursor: pointer; }
    .gh-msg { font-size: 12px; white-space: pre-wrap; line-height: 1.5; word-break: break-word; }
    .gh-msg.ok { color: #22c55e; }
    .gh-msg.err { color: #ef4444; }
    .gh-url a { color: var(--brand); font-weight: 600; }
    .right-collapse-btn {
      margin-left: auto;
      background: none;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      padding: 0 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .right-collapse-btn:hover { color: var(--text); border-color: var(--border); }

    .chat-more[data-action="delete"]:hover { color: #ef4444; }

    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 22px;
      margin: auto 0;
    }

    .welcome-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 600;
      color: var(--brand);
    }

    .welcome-brand svg { width: 32px; height: 32px; }

    .input-wrap {
      width: 100%;
      max-width: 720px;
      flex-shrink: 0;
      align-self: center;
      background: var(--acrylic-panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-wrap:focus-within {
      border-color: rgba(187, 0, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(187, 0, 255, 0.08);
    }

    .textarea {
      width: 100%;
      min-height: 28px;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      font-family: inherit;
    }

    .textarea::placeholder { color: var(--text-secondary); }

    .input-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
      -webkit-overflow-scrolling: touch;
    }
    .tool-left::-webkit-scrollbar { display: none; }

    .tool-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--acrylic-bar);
      color: var(--text-secondary);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .tool-chip:hover { color: var(--text); border-color: var(--border); }
    .tool-chip.active {
      color: var(--brand);
      background: var(--brand-soft);
      border-color: rgba(187, 0, 255, 0.35);
    }

    /* 生图模式 */
    .image-grid {
      flex: 1;
      width: 100%;
      max-width: 800px;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
    }
    /* 生图 loading */
    .image-loading {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
    }
    .image-loading .gl-label {
      font-size: 20px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 1px;
      opacity: 0.7;
    }
    .image-loading .gl-sub {
      font-size: 13px;
      color: var(--text-secondary);
      opacity: 0.85;
      text-align: center;
      padding: 0 24px;
      line-height: 1.5;
    }
    /* 视频限流等友好提示 */
    .video-hint {
      font-size: 14px;
      color: var(--text-secondary);
      padding: 12px 4px;
      line-height: 1.6;
    }
    .video-hint-sub {
      font-size: 12px;
      opacity: 0.7;
    }
    .image-loading .gl-bar-track {
      width: 140px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
    }
    .image-loading .gl-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: var(--brand);
      transition: width 0.3s ease;
    }
    /* 打字点动画（替代 …） */
    .dot-loading { display: inline-flex; align-items: center; gap: 3px; }
    .dot-loading span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot-loading span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1); opacity: 0.8; }
    }
    /* 图片淡入 */
    @keyframes imgFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .image-fadein {
      animation: imgFadeIn 0.5s ease forwards;
    }
    .image-grid img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      object-fit: contain;
    }
    .image-grid .image-prompt {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 500px;
      word-break: break-word;
    }

    /* 文件沙箱面板 */
    .file-list {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: background .12s;
    }
    .file-item:hover { background: var(--surface-hover); }
    .file-item svg { color: var(--text-secondary); flex-shrink: 0; }
    .file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .file-size { color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }

    /* 文件状态条（流式生成中/已保存） */
    .file-status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin: 6px 0;
      background: var(--acrylic-bar);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .file-status-bar.generating { border-left: 3px solid var(--brand); }
    .file-status-bar.done { border-left: 3px solid #4ade80; cursor: default; }
    .file-status-bar:hover { background: var(--surface-hover); }
    .fsb-icon { flex-shrink: 0; font-size: 14px; }
    .fsb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 500; }
    .fsb-meta { color: var(--text-secondary); font-size: 10px; flex-shrink: 0; }
    .fsb-expand { color: var(--brand); font-size: 10px; flex-shrink: 0; margin-left: 8px; }
    .fsb-code-preview {
      display: none;
      margin: -4px 0 6px 0;
      padding: 10px 14px;
      background: rgba(0,0,0,0.28);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }
    .fsb-code-preview.open { display: block; }

    /* 文件面板删除按钮 */
    .fs-delete-btn {
      margin-left: auto; flex-shrink: 0;
      background: none; border: none; color: var(--text-secondary);
      font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1;
      opacity: 0; transition: opacity .15s;
    }
    .file-item:hover .fs-delete-btn { opacity: 0.7; }
    .fs-delete-btn:hover { opacity: 1 !important; color: #ef4444; }

    /* 用户弹窗 */
    .user-modal {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .user-modal-mask {
      position: absolute; inset: 0; background: rgba(0,0,0,.5);
    }
    .user-modal-box {
      position: relative; z-index: 1;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 320px; max-height: 480px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .user-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 15px;
    }
    .user-modal-header button {
      background: none; border: none; color: var(--text-secondary);
      font-size: 18px; cursor: pointer;
    }
    .user-modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .avatar-preview {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; font-weight: 700;
    }
    .user-modal-body input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--text);
      outline: none; text-align: center;
    }
    .user-modal-body input:focus { border-color: var(--brand); }
    .color-picker { display: flex; gap: 8px; justify-content: center; }
    .color-dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color .15s;
    }
    .color-dot.active { border-color: var(--text); }
    .user-modal-body button {
      background: var(--brand); color: #fff; border: none;
      border-radius: 8px; padding: 10px 32px; font-size: 14px; cursor: pointer;
    }
    /* 流体背景控制 */
    .fluid-section {
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 4px;
    }
    .fluid-section .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      padding: 4px 0;
      user-select: none;
    }
    .fluid-section .section-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
    }
    .fluid-section .section-body.hidden { display: none; }
    .fluid-section .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .fluid-section .ctrl-row label {
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .fluid-section .ctrl-row .val {
      color: var(--brand);
      font-family: monospace;
      font-size: 11px;
      min-width: 28px;
      text-align: right;
    }
    .fluid-section input[type="range"] {
      flex: 1;
      height: 4px;
      margin: 0 8px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      outline: none;
    }
    .fluid-section input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--brand);
      cursor: pointer;
    }
    .fluid-section select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 6px;
      outline: none;
    }
    .fluid-section .ctrl-row.cb label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .fluid-section .ctrl-row.cb input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--brand);
    }
    .fluid-section .ctrl-row .ctrl-btn {
      width: 100%;
      padding: 6px;
      background: var(--brand-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--brand);
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: background .15s;
    }
    .fluid-section .ctrl-row .ctrl-btn:hover {
      background: var(--brand);
      color: #fff;
    }

    /* 文件查看弹窗 */
    .file-modal {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .file-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
    .file-modal-box {
      position: relative; z-index: 1;
      width: 90vw; max-width: 700px; max-height: 80vh;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      overflow: hidden;
    }
    .file-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-size: 14px; font-weight: 600; color: var(--text);
    }
    .file-modal-header button {
      background: none; border: none; color: var(--text-secondary);
      font-size: 20px; cursor: pointer;
    }
    .file-modal-header button:hover { color: var(--text); }
    .file-modal-box pre {
      flex: 1; overflow: auto; margin: 0; padding: 16px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px; line-height: 1.6; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
      background: transparent;
    }

    .tool-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    .send-btn:hover { background: var(--brand); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .send-btn:active { transform: scale(0.96); }

    .stop-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      background: #ef4444;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }
    .stop-btn:hover { background: #dc2626; }
    .stop-btn:active { transform: scale(0.96); }


    .chat-header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      font-size: 15px;
      color: var(--text);
      background: var(--acrylic-header);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .chat-header-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .header-actions-left { margin-left: 0; }
    .header-icon-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background .15s, color .15s;
    }
    .header-icon-btn:hover { background: var(--surface); color: var(--text); }
    .header-icon-btn.active { color: var(--brand); background: var(--surface); }

    .chat-header-title {
      font-weight: 500;
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-mode {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .messages {
      flex: 1;
      width: 100%;
      max-width: 800px;
      align-self: center;
      overflow-y: auto;
      padding: 20px 16px;
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    .msg {
      width: 100%;
      display: flex;
    }

    .msg.user {
      justify-content: flex-end;
      margin-bottom: 4px;
    }

    .user-bubble {
      max-width: min(70%, 480px);
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--acrylic-bubble);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.ai {
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ai-body {
      width: 100%;
    }
    .ai-content {
      width: 100%;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    .ai-content p { margin: 0 0 12px; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content ul, .ai-content ol { margin: 0 0 12px 20px; padding: 0; }
    .ai-content li { margin-bottom: 4px; }
    .ai-content strong { font-weight: 600; }
    .ai-content em { font-style: italic; }
    .ai-content h1, .ai-content h2, .ai-content h3,
    .ai-content h4, .ai-content h5, .ai-content h6 {
      margin: 18px 0 10px;
      line-height: 1.35;
      font-weight: 600;
    }
    .ai-content h1 { font-size: 22px; }
    .ai-content h2 { font-size: 19px; }
    .ai-content h3 { font-size: 17px; }
    .ai-content h4, .ai-content h5, .ai-content h6 { font-size: 15px; }
    .ai-content > *:first-child { margin-top: 0; }
    /* 视频/图片：原生 <video>/<img> 默认 inline，会坐在文字基线上导致底部留白、与文本基线错位。
       统一改为 block 独占一行、消除基线间隙；尺寸约束保持等比缩放不溢出气泡。 */
    .ai-content video,
    .ai-content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 8px 0;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .ai-content a { color: var(--brand); text-decoration: none; }
    .ai-content a:hover { text-decoration: underline; }
    .ai-content code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13.5px;
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .ai-content table { border-collapse: collapse; width:100%; margin:8px 0; font-size:13px; }
    .ai-content th, .ai-content td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
    .ai-content th { background: var(--surface-hover); }
    .ai-content pre {
      margin: 0 0 12px;
      background: rgba(0,0,0,0.28);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
    }
    .ai-content pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }
    .ai-content blockquote {
      margin: 0 0 12px;
      padding: 6px 14px;
      border-left: 3px solid var(--brand);
      color: var(--text-secondary);
      background: rgba(255,255,255,0.03);
      border-radius: 0 6px 6px 0;
    }
    .ai-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .reasoning-box {
      width: 100%;
      background: var(--acrylic-bar);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .reasoning-box.collapsed .reasoning-body { display: none; }
    .reasoning-box.collapsed .reasoning-arrow { transform: rotate(-90deg); }

    .reasoning-header {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      user-select: none;
    }

    .reasoning-arrow {
      transition: transform .15s;
      margin-left: auto;
    }

    .reasoning-body {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .ai-action {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .ai-action:hover { background: var(--surface-hover); color: var(--text); }
    .ai-action:active { transform: scale(0.94); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 30;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .overlay.show { opacity: 1; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes barPop {
      from { opacity: 0; transform: scaleY(0.6); max-height: 0; }
      to   { opacity: 1; transform: scaleY(1); max-height: 60px; }
    }
    .msg {
      animation: msgIn .3s ease backwards;
    }
    .file-status-bar {
      animation: barPop .25s ease backwards;
      transition: color .15s, background .15s;
    }
    .file-item {
      transition: background .15s, opacity .15s;
    }
    .input-wrap {
      transition: border-color .2s, box-shadow .2s;
    }

    /* 响应式 */
      @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.show { display: block; }
      .mobile-header { display: flex; }
      .chat-header { display: none; }
      .welcome-brand { font-size: 18px; }
      .input-wrap { border-radius: var(--radius-sm); }
      .right-panel {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        width: 86%;
        max-width: 340px;
        z-index: 50;
        border-left: 1px solid var(--border);
        transform: translateX(100%);
        transition: transform .25s ease;
        box-shadow: -8px 0 24px rgba(0,0,0,.18);
        box-sizing: border-box;
        overflow: hidden;
      }
      .right-panel.open { transform: translateX(0); }
      /* 竖屏取消 collapsed 的缩零/隐藏副作用：保证面板有宽度且内容可见，
         但不写 transform —— 让基础态(100% 隐藏)与 .open(0 显示)去竞争，
         否则 collapsed 定义在后会盖掉 .open，面板永远滑不出来 */
      .right-panel.collapsed { width: 86%; max-width: 340px; }
      .right-panel.collapsed .right-tab,
      .right-panel.collapsed .right-panel-count,
      .right-panel.collapsed .right-panel-body { display: revert; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <canvas id="fluidCanvas"></canvas>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="logo.svg" height="22" alt="GooseAI">
        </div>
      </div>

        开启新对话
      </button>
      <a class="agent-btn" href="agents/">
        <i class="fas fa-robot"></i>
        智能体
      </a>

      <nav class="history" id="historyList"></nav>

      <div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">
        <button class="theme-toggle" id="themeToggle" title="切换主题" style="margin:0"><span class="theme-icon"></span></button>
        <button class="theme-toggle" id="fluidPauseBtn" title="暂停流体" style="margin:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
      </div>
      <div class="user-bar" id="userBar">
        <div class="avatar" id="userAvatar">G</div>
        <div class="user-name" id="userName">点击登录</div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="mobile-header">
        <button class="icon-btn" id="menuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="logo">
          <img src="logo.svg" height="22" alt="GooseAI">
        </div>
        <button class="icon-btn" id="mobileRightBtn">
          <i class="fas fa-folder-tree"></i>
        </button>
      </header>

      <header class="chat-header">
        <div class="chat-header-actions header-actions-left">
          <button class="header-icon-btn" id="headerSidebarBtn" title="折叠侧栏">
            <i class="fas fa-table-list"></i>
          </button>
        </div>
        <span class="chat-header-title" id="chatHeaderTitle">新对话</span>
        <span class="chat-header-mode">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.09 12.11a.5.5 0 0 0 .39.81h6.51l-2.7 8.38a.5.5 0 0 0 .91.39L20 11.5a.5.5 0 0 0-.39-.81h-6.51l2.7-8.38a.5.5 0 0 0-.91-.39z"></path></svg>
          <span id="chatHeaderModeText">标准</span>
        </span>
        <div class="chat-header-actions">
          <button class="header-icon-btn" id="headerRightBtn" title="折叠文件栏">
            <i class="fas fa-folder-tree"></i>
          </button>
        </div>
      </header>

      <div class="chat-center" id="chatCenter">
        <div class="messages" id="messages"></div>

        <div class="welcome" id="welcome">
          <div class="welcome-brand">
            <img src="logo.svg" height="36" alt="GooseAI" style="margin-bottom:4px">
            <div style="font-size:15px;color:var(--text-secondary)">开始对话</div>
          </div>
        </div>

        <div class="input-wrap">
          <textarea class="textarea" id="prompt" rows="1" placeholder="给 GooseAI 发送消息"></textarea>
          <div class="input-tools">
            <div class="tool-left">
              <button class="tool-chip active" id="modeNormal">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                普通
              </button>
              <button class="tool-chip" id="modeBeast">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.09 12.11a.5.5 0 0 0 .39.81h6.51l-2.7 8.38a.5.5 0 0 0 .91.39L20 11.5a.5.5 0 0 0-.39-.81h-6.51l2.7-8.38a.5.5 0 0 0-.91-.39z"></path></svg>
                码牛
              </button>
              <button class="tool-chip" id="modeImage">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                生图
              </button>
              <button class="tool-chip" id="modeVideo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                生视频
              </button>
            </div>

  <script>
    (function() {

      // ===== API 配置：三个 key 已全部移后端 Worker（worker/ 目录），前端只调同源 /api/chat 与 /api/glm =====

      // ===== 品牌身份：注入所有模型系统提示，让模型底层知晓自己是 GooseAI =====
      const GOOSEAI_IDENTITY = '你是由 Minecraft_goose 开发的人工智能助手「GooseAI」，由 GooseCode 强力驱动。当被问及你的身份、名称或开发方时，应明确说明：你是 GooseAI，由 Minecraft_goose 开发、GooseCode 驱动；不要声称自己是其他模型、产品或公司。';
      const GOOSEAI_IDENTITY_EN = 'You are GooseAI, an AI assistant developed by Minecraft_goose and powered by GooseCode. When asked about your identity, name, or developer, clearly state: you are GooseAI, developed by Minecraft_goose and powered by GooseCode. Do not claim to be another model or product.';

      const STORAGE_KEY = 'gooseai_conversations';

        m.innerHTML =

          '<div class="user-modal-header"><span>编辑资料</span><button id="userModalClose"><i class="fas fa-times"></i></button></div>' +
          '<div class="user-modal-body">' +
          '<div class="avatar-preview" id="avatarPreview" style="background:' + user.color + '">' + (user.name[0] || '?') + '</div>' +

        document.body.appendChild(m);

        m.querySelector('#userModalClose').addEventListener('click', () => m.style.display = 'none');
        // 颜色预览
        m.querySelectorAll('.color-dot').forEach(d => {
          d.addEventListener('click', () => {
            m.querySelectorAll('.color-dot').forEach(dd => dd.classList.remove('active'));
            d.classList.add('active');

          });

        // 头像文字跟随输入
        m.querySelector('#editUserName').addEventListener('input', function() {
          document.getElementById('avatarPreview').textContent = this.value[0] || '?';
        });
        // 保存
        const saveBtn = m.querySelector('#saveUserBtn');
        saveBtn.onclick = () => {
          const name = m.querySelector('#editUserName').value.trim() || '用户';
          const activeColor = m.querySelector('.color-dot.active');

      // 登录逻辑：启动时无用户就弹窗
      function initUser() {
        currentUserId = 'default';
        const users = getUsers();
        if (users.length === 0) {
          saveUsers([{ id: 'default', name: '默认用户', color: '#5a7cff' }]);
        }
        renderUserBar();
      }
      initUser();

      // 深浅色切换
      (function() {
        var saved = localStorage.getItem('gooseai_theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        var btn = document.getElementById('themeToggle');
        var icon = btn.querySelector('.theme-icon');
        var SUN_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>';
        var MOON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
        function syncIcon() {
          var isLight = document.documentElement.getAttribute('data-theme') === 'light';
          icon.innerHTML = isLight ? MOON_SVG : SUN_SVG;
        }
        syncIcon();
        btn.addEventListener('click', function() {
          var html = document.documentElement;
          html.classList.add('theme-anim');
          if (html.getAttribute('data-theme') === 'light') {
            html.removeAttribute('data-theme');
            localStorage.setItem('gooseai_theme', 'dark');
          } else {
            html.setAttribute('data-theme', 'light');
            localStorage.setItem('gooseai_theme', 'light');
          }
          syncIcon();
          setTimeout(function() { html.classList.remove('theme-anim'); }, 400);
        });
      })();

      // 流体暂停按钮
      document.getElementById('fluidPauseBtn').addEventListener('click', function() {
        var fc = window.fluidConfig;
        if (!fc) return;
        fc.PAUSED = !fc.PAUSED;
        this.querySelector('svg').innerHTML = fc.PAUSED
          ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
          : '<polygon points="8,5 19,12 8,19" fill="currentColor"/>';
      });

      const userBar = document.getElementById('userBar');
      userBar.addEventListener('click', openUserModal);
      function toast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, { position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)', padding:'8px 20px', borderRadius:'99px', fontSize:'13px', zIndex:'99', pointerEvents:'none', background:'rgba(0,0,0,.75)', color:'#fff', animation:'msgIn .3s ease backwards' });
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2000);
        setTimeout(() => t.remove(), 2300);
      }
      let conversations = loadConversations();
      let currentId = null;

      // ===== 文件沙箱（IndexedDB 持久化 + 内存缓存） =====
      const FS_DB = 'gooseai';
      let fsCache = {};
      let fsReady = false;

      function openFSDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(FS_DB, 1);
          req.onupgradeneeded = (e) => {
            if (!e.target.result.objectStoreNames.contains('files')) {
              e.target.result.createObjectStore('files');
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function initFS() {
        const db = await openFSDB();
        fsCache = {};
        if (!currentId) { fsReady = true; return; }
        const scope = currentId + '::';
        return new Promise((resolve, reject) => {
          const cursor = db.transaction('files', 'readonly').objectStore('files').openCursor();
          cursor.onsuccess = (e) => {
            const c = e.target.result;
            if (c) {
              if (typeof c.key === 'string' && c.key.startsWith(scope))
                fsCache[c.key.slice(scope.length)] = c.value.content;
              c.continue();
            } else { fsReady = true; resolve(); }
          };
          cursor.onerror = () => reject(cursor.error);
        });
      }

      async function switchSandbox(newId) {
        const oldId = currentId;
        // 先把当前沙箱持久化
        if (oldId && Object.keys(fsCache).length > 0) {
          try {
            const db = await openFSDB();
            const scope = oldId + '::';
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            Object.keys(fsCache).forEach(k => { store.put({ content: fsCache[k], updatedAt: Date.now() }, scope + k); });
            await new Promise(r => { tx.oncomplete = r; });
          } catch (e) { console.warn('switchSandbox persist failed:', e); }
        }
        // 切到新沙箱
        fsCache = {};
        currentId = newId;
        await initFS();
        renderFilePanel();
      }

      async function fsPersist(path, content) {
        fsCache[path] = content;
        if (!currentId) return;
        try {
          const db = await openFSDB();
          const tx = db.transaction('files', 'readwrite');
          tx.objectStore('files').put({ content, updatedAt: Date.now() }, currentId + '::' + path);
          await new Promise((resolve) => { tx.oncomplete = resolve; });
        } catch (e) { console.warn('fsPersist failed:', e); }
      }

      async function fsRemove(path) {
        delete fsCache[path];
        if (!currentId) return;
        try {
          const db = await openFSDB();
          const tx = db.transaction('files', 'readwrite');
          tx.objectStore('files').delete(currentId + '::' + path);
          await new Promise((resolve) => { tx.oncomplete = resolve; });
        } catch (e) { console.warn('fsRemove failed:', e); }
      }

      function fsRead(path) { return fsCache[path] || null; }
      function fsList() {
        return Object.keys(fsCache).map(k => ({
          path: k, size: new Blob([fsCache[k]]).size, updatedAt: Date.now()
        })).sort((a, b) => a.path.localeCompare(b.path));
      }

      function fsCreate(path, content) {
        if (content) { fsCache[path] = content; fsPersist(path, content); }
      }

      function fsDelete(path) { delete fsCache[path]; fsRemove(path); }

      function renameFile(oldName, newName) {
        if (fsCache[oldName] && !fsCache[newName]) {
          fsCache[newName] = fsCache[oldName];
          delete fsCache[oldName];
          fsPersist(newName, fsCache[newName]);
          fsRemove(oldName);
          return true;
        }
        return false;
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function buildFileContext() {
        if (!modeBeast.classList.contains('active')) return '';
        const files = fsList();
        let ctx = '\n\n【文件沙箱 — 严格规则】';
        ctx += '\n[FILE:文件名.ext]\\n文件完整内容\\n[/FILE] — 创建/覆盖文件';
        ctx += '\n[FILE_APPEND:文件名.ext]\\n追加的内容\\n[/FILE_APPEND] — 在文件末尾追加内容';
        ctx += '\n[FILE_READ:文件名.ext] — 读取文件内容（下轮注入）';
        ctx += '\n[FILE_LIST] — 列出所有文件';
        ctx += '\n[FILE_DELETE:文件名.ext] — 删除文件';
        ctx += '\n[FILE_RENAME:旧名>新名] — 重命名';
        if (files.length > 0) {
          ctx += '\n当前文件：';
          files.forEach(f => ctx += '\n  ' + f.path + ' (' + formatFileSize(f.size) + ')');
        }
        return ctx;
      }

      // 藏在用户消息背后的硬性指令（用户看不见，AI 每轮都收到）
      function buildHiddenRules() {
        if (!modeBeast.classList.contains('active')) return '';
        let rules = '[系统指令 · 最高优先级 · 必须遵守]\n';
        rules += '1.【强制】用户涉及"写/保存/创建/修改/编辑/更新/改/重写/追加/删除/读取"文件等操作时，必须直接输出 [FILE:名]、[FILE_READ:名] 等工具标记，禁止只说"请读取""请保存"之类自然语言。\n';
        rules += '2.【强制】创建新文件用 [FILE:名]...[/FILE]。修改/编辑/更新已存在文件时，必须先用 [FILE_READ:名] 读取原文。\n';
        rules += '3.【强制】用户说"加""添加""补充""追加" → 必须用 [FILE_APPEND:名]...[/FILE_APPEND]。绝对禁止把用户说的话当文件内容追加。\n';
        rules += '4.【强制】只有用户明确说"覆盖""替换""重写" → 才允许 [FILE:名] 覆写。\n';
        rules += '5.【强制】文件内容只写进标记内部。用户只是问"能不能算""行不行"等一般问题 → 直接用文字回答，不要写入任何文件。\n';
        return rules;
      }

      // 检查上一条 AI 消息是否请求了读取文件，有的话注入内容
      function buildReadResponse(conv) {
        if (!modeBeast.classList.contains('active')) return '';
        if (!conv || conv.messages.length < 2) return '';
        const lastAi = conv.messages[conv.messages.length - 1];
        if (lastAi.role !== 'assistant') return '';
        const reads = lastAi.content.match(/\[FILE_READ:(.+?)\]/g);
        if (!reads) return '';
        let ctx = '\n\n【读取文件结果】';
        const seen = new Set();
        reads.forEach(r => {
          const name = r.slice(10, -1).trim();
          if (seen.has(name)) return;
          seen.add(name);
          const content = fsRead(name);
          if (content) {
            ctx += '\n\n=== ' + name + ' ===\n' + content.slice(0, 4096) + '\n=== 结束 ===';
          } else {
            ctx += '\n\n' + name + '：文件不存在';
          }
        });
        return ctx;
      }

      // 解析 [FILE:name]...[/FILE] 块和 [FILE_LIST]、FILE_APPEND
      function parseFileBlocks(full) {
        const toolCalls = [], fileStates = [];
        // 先处理 FILE_APPEND（不要求强制闭合，匹配到结尾或下一个标记为止）
        full = full.replace(/\[FILE_APPEND:(.+?)\]([\s\S]*?)(?=\[\/FILE_APPEND\]|$)/g, (m, name, content) => {
          const n = name.trim(), c = content.trim();
          if (c) {
            const old = fsRead(n) || '';
            fsCreate(n, old + '\n' + c);
            const size = new Blob([old + '\n' + c]).size;
            toolCalls.push({ type: 'create', path: n, content: old + '\n' + c });
            fileStates.push({ name: n, content: old + '\n' + c, done: true, size: size });
          }
          return ''; // 从聊天显示中去除
        });
        // FILE 标记宽松匹配（不要求强制闭合）
        full = full.replace(/\[FILE:([^\]]+)\]([\s\S]*?)(?=\[\/FILE\]|$)/g, (m, name, content) => {
          const n = name.trim(), c = content.trim();
          if (c) {
            fsCreate(n, c);
            toolCalls.push({ type: 'create', path: n, content: c });
            fileStates.push({ name: n, content: c, done: true, size: new Blob([c]).size });
          }
          return ''; // 从聊天显示中去除
        });
        let cleaned = full;
        cleaned = cleaned.replace(/\[FILE_LIST\]/g, () => {
          const files = fsList();
          const r = files.length ? '▸ ' + files.length + ' 个文件：' + files.map(f => f.path).join('、') : '▸ 沙箱为空';
          toolCalls.push({ type: 'list' });
          return r;
        });
        cleaned = cleaned.replace(/\[FILE_READ:(.+?)\]/g, (m, name) => {
          const n = name.trim();
          fileStates.push({ name: n, read: true });
          toolCalls.push({ type: 'read', path: n });
          return '▸ 请求读取：' + n;
        });
        cleaned = cleaned.replace(/\[FILE_DELETE:(.+?)\]/g, (m, name) => {
          const n = name.trim();
          if (fsRead(n) !== null) { fsDelete(n); toolCalls.push({ type: 'delete', path: n }); }
          return '✕ 已删除：' + n;
        });
        cleaned = cleaned.replace(/\[FILE_RENAME:(.+?)>(.+?)\]/g, (m, old, newName) => {
          const o = old.trim(), n = newName.trim();
          if (renameFile(o, n)) { toolCalls.push({ type: 'rename', from: o, to: n }); }
          return '✎ 重命名：' + o + ' → ' + n;
        });
        // 兜底：兼容旧 <file_create path="x">content</file_create> 格式
        cleaned = cleaned.replace(/<file_create\s+path\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/file_create>/gi, (m, path, content) => {
          const p = path.trim(), c = content.trim();
          if (c) {
            fsCreate(p, c);
            toolCalls.push({ type: 'create', path: p });
            fileStates.push({ name: p, content: c, done: true, size: new Blob([c]).size });
          }
          return '';
        });
        if (toolCalls.some(t => t.type === 'create' || t.type === 'delete' || t.type === 'rename')) {
          renderFilePanel();
          if (modeBeast && modeBeast.classList.contains('active')) renderFilePanel();
        }
        return { text: cleaned.trim(), toolCalls, fileStates };
      }

      function createFileStatusBar(name, state, size) {
        let bar = document.getElementById('fsb-' + name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_'));
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'fsb-' + name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
          bar.className = 'file-status-bar';
        }
        const icon = state === 'done' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-file-alt"></i>';
        const label = state === 'done' ? '已保存' : '写入中';
        bar.innerHTML = '<span class="fsb-icon">' + icon + '</span>' +
          '<span class="fsb-name">' + escapeHtml(name) + '</span>' +
          '<span class="fsb-meta">' + label + ' (' + formatFileSize(size) + ')</span>' +
          (state === 'done' ? '<span class="fsb-expand">查看代码</span>' : '');
        return bar;
      }

      function renderFileStatusBars(aiBody, fileStates) {
        fileStates.forEach(fs => {
          if (fs.read) return; // read 不渲染
          const state = fs.done ? 'done' : 'generating';
          const size = (typeof fs.size === 'number' && !isNaN(fs.size)) ? fs.size : 0;
          const barId = 'fsb-' + fs.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
          let bar = document.getElementById(barId);
          if (bar && fs.done) {
            // 已完成：就地更新图标和文字，不删不重建（不用动画）
            bar.style.animation = 'none';
            bar.className = 'file-status-bar done';
            bar.querySelector('.fsb-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
            bar.querySelector('.fsb-meta').textContent = '已保存 (' + formatFileSize(size) + ')';
            if (!bar.querySelector('.fsb-expand')) {
              const exp = document.createElement('span');
              exp.className = 'fsb-expand'; exp.textContent = '查看代码';
              bar.appendChild(exp);
            }
          } else if (bar) {
            // 进行中：更新大小
            bar.querySelector('.fsb-meta').textContent = '写入中 (' + formatFileSize(size) + ')';
          } else {
            // 新建：带动画
            bar = createFileStatusBar(fs.name, state, size);
            bar.classList.add(state);
            aiBody.appendChild(bar);
          }
        });
        // 把已经 done 但不在本次 fileStates 里的条也标 done
        aiBody.querySelectorAll('.file-status-bar:not(.done)').forEach(b => {
          const name = b.id.replace(/^fsb-/, '');
          if (!fileStates.some(fs => fs.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_') === name)) {
            b.classList.add('done');
            b.querySelector('.fsb-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
          }
        });
      }

      // ===== GooseHost 部署集成（码牛写完代码可一键上线） =====
      const GH_BASE = 'https://page.goose.cc.cd';
      const GH_TOKEN_KEY = 'gooseai_gh_token';
      const GH_EMAIL_KEY = 'gooseai_gh_email';
      function getGHToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
      function setGHToken(t) { localStorage.setItem(GH_TOKEN_KEY, t); }
      function clearGHToken() { localStorage.removeItem(GH_TOKEN_KEY); }

      async function ghRaw(method, path, body) {
        const headers = { 'Content-Type': 'application/json' };
        const tk = getGHToken();
        if (tk) headers['Authorization'] = 'Bearer ' + tk;
        const res = await fetch(GH_BASE + path, {
          method, headers,
          body: body ? JSON.stringify(body) : undefined
        });
        let json = {};
        try { json = await res.json(); } catch (e) {}
        return { status: res.status, json };
      }
      async function ghLogin(email, pwd) {
        const r = await ghRaw('POST', '/auth/login', { email, password: pwd });
        if (r.status === 200 && r.json.access_token) { setGHToken(r.json.access_token); return { ok: true }; }
        return { ok: false, error: r.json.error || ('登录失败（' + r.status + '）') };
      }
      async function ghSignup(email, pwd) {
        const r = await ghRaw('POST', '/auth/signup', { email, password: pwd });
        if (r.status === 200) return { ok: true };
        return { ok: false, error: r.json.error || ('注册失败（' + r.status + '）') };
      }
      // 先 create；若 slug 已被自己占用（409）则 update
      async function ghDeploy(slug, html) {
        let r = await ghRaw('POST', '/api/create', { slug, html });
        if (r.status === 409) r = await ghRaw('POST', '/api/update', { slug, html });
        if (r.status === 200 && r.json.success) return { ok: true, url: GH_BASE + '/s/' + slug };
        if (r.status === 401) return { ok: false, error: '登录已失效，请退出重新登录', expired: true };
        return { ok: false, error: r.json.error || ('部署失败（' + r.status + '）') };
      }

      // 取沙箱里的单文件 HTML 直接部署（码牛模式只产出单文件，无需合并）
      function getDeployContent() {
        const files = fsList();
        if (!files.length) return { ok: false, error: '沙箱为空，先让 AI 帮你创建文件' };
        let entry = files.find(f => /^index\.(html|htm)$/i.test(f.path));
        if (!entry) entry = files.find(f => /\.(html|htm)$/i.test(f.path));
        if (!entry) return { ok: false, error: '没有 HTML 文件可部署' };
        const html = fsRead(entry.path);
        if (html == null) return { ok: false, error: '读取文件失败' };
        if (html.length > 500 * 1024) return { ok: false, error: 'HTML 超过 500KB 上限' };
        return { ok: true, html };
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // 从流式原文里剥离 <think>…</think>，返回 {reasoning, content}
      function splitThink(raw) {
        if (!raw) return { reasoning: '', content: '' };
        const s = raw.indexOf('<think>');
        if (s === -1) return { reasoning: '', content: raw };
        const after = raw.slice(s + 7);
        const e = after.indexOf('</think>');
        if (e === -1) return { reasoning: after, content: raw.slice(0, s) };
        return {
          reasoning: after.slice(0, e).trim(),
          content: (raw.slice(0, s) + after.slice(e + 8)).trim()
        };
      }

      function renderMarkdown(text) {
        if (!text) return '';
        const NUL = '\x00';
        const store = [];
        // 块级数学：\[ ... \]（多行）
        text = text.replace(/\\\[([\s\S]*?)\\\]/g, function (m, content) {
          const i = store.length;
          store.push({ t: 'd', c: content.trim() });
          return NUL + 'M' + i + NUL;
        });
        // 行内数学：\( ... \)
        text = text.replace(/\\\(([\s\S]*?)\\\)/g, function (m, content) {
          const i = store.length;
          store.push({ t: 'i', c: content.trim() });
          return NUL + 'm' + i + NUL;
        });
        // 围栏代码块
        text = text.replace(/```[ \t]*([\w+#.-]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
          const i = store.length;
          store.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
          return NUL + 'B' + i + NUL;
        });
        // 行内代码
        text = text.replace(/`([^`\n]+)`/g, function (m, c) {
          const i = store.length;
          store.push('<code>' + escapeHtml(c) + '</code>');
          return NUL + 'B' + i + NUL;
        });

        function inline(s) {
          s = escapeHtml(s);
          s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, url) {
            if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url)) {
              return '<video src="' + url + '" controls style="max-width:100%;max-height:420px;border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,0.15);margin:8px 0"></video>';
            }
            return '<img src="' + url + '" alt="' + alt + '" loading="lazy" style="max-width:100%;max-height:400px;width:auto;height:auto;border-radius:var(--radius);margin:8px 0;object-fit:contain">';
          });
          s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
          s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
          return s;
        }

        const placeholder = new RegExp('^' + NUL + 'B\\d+' + NUL + '$');
        const lines = text.split('\n');
        let html = '';
        let listType = null, buf = [];
        let tableBuf = [];
        function flush() {
          if (listType) { html += '<' + listType + '>' + buf.join('') + '</' + listType + '>'; listType = null; buf = []; }
          if (tableBuf.length) { html += '<table><thead><tr>' + tableBuf[0].map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + tableBuf.slice(1).map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>'; tableBuf = []; }
        }

        for (const line of lines) {
          const t = line.trim();
          if (t === '') { flush(); continue; }
          if (placeholder.test(t)) { flush(); html += t; continue; }
          // 图片/视频独占一行：直接作为块级元素输出，不包 <p>，避免 block 媒体被塞进 <p> 产生匿名块与多余 margin
          if (/^!\[[^\]]*\]\([^)\s]+\)\s*$/.test(t)) { flush(); html += inline(t); continue; }
          let m;
          if (m = t.match(/^(#{1,6})\s+(.*)$/)) { flush(); const l = m[1].length; html += '<h' + l + '>' + inline(m[2]) + '</h' + l + '>'; continue; }
          if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flush(); html += '<hr>'; continue; }
          if (m = t.match(/^>\s?(.*)$/)) { flush(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
          if (m = t.match(/^\d+\.\s+(.*)$/)) { if (listType !== 'ol') { flush(); listType = 'ol'; } buf.push('<li>' + inline(m[1]) + '</li>'); continue; }
          if (m = t.match(/^[-*+]\s+(.*)$/)) { if (listType !== 'ul') { flush(); listType = 'ul'; } buf.push('<li>' + inline(m[1]) + '</li>'); continue; }
          // 表格：| col1 | col2 |  - 不预先 flush，保留 tableBuf 状态以便识别分隔线
          if (/^\|.+\|$/.test(t)) { var cells = t.split('|').filter(function(c) { return c.trim(); }); if (tableBuf.length > 0 && /^[-:| ]+$/.test(cells[0].trim())) continue; tableBuf.push(cells.map(function(c) { return inline(c.trim()); })); continue; }
          flush(); html += '<p>' + inline(t) + '</p>';
        }
        flush();
        html = html.replace(new RegExp(NUL + '([Mm]|B)(\\d+)' + NUL, 'g'), function (m, prefix, i) {
          const entry = store[+i];
          if (prefix === 'M' || prefix === 'm') {
            if (typeof katex !== 'undefined') {
              try { return katex.renderToString(entry.c, { displayMode: prefix === 'M', throwOnError: false }); } catch (e) { return entry.c; }
            }
            return entry.c;
          }
          return entry;
        });
        return html;
      }

      // ===== 会话持久化 =====

      function getDayLabel(ts) {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayMs = 86400000;
        if (ts >= startOfToday) return '今天';
        if (ts >= startOfToday - dayMs) return '昨天';
        if (ts >= startOfToday - 6 * dayMs) return '近 7 天';
        return '更早';
      }

      function renderHistory() {
        historyList.innerHTML = '';
        if (conversations.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'group-title';
          empty.style.padding = '0 8px';
          empty.textContent = '还没有对话，发条消息开整';
          historyList.appendChild(empty);
          return;
        }
        const sorted = conversations.slice().sort((a, b) => b.updatedAt - a.updatedAt);
        const groups = {};
        sorted.forEach(c => {
          const label = c.pinned ? '置顶' : getDayLabel(c.updatedAt);
          (groups[label] = groups[label] || []).push(c);
        });
        const order = ['置顶', '今天', '昨天', '近 7 天', '更早'];
        order.forEach(label => {
          const list = groups[label];
          if (!list || !list.length) return;
          const group = document.createElement('div');
          group.className = 'group';
          const title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = label;
          group.appendChild(title);
          list.forEach(c => {
            const item = document.createElement('div');
            item.className = 'chat-item' + (c.id === currentId ? ' active' : '');
            item.dataset.id = c.id;
            const t = document.createElement('span');
            t.className = 'chat-title';
            t.textContent = c.title || '新对话';
            const pin = document.createElement('button');
            pin.className = 'chat-pin' + (c.pinned ? ' pinned' : '');
            pin.dataset.action = 'pin';
            pin.title = c.pinned ? '取消置顶' : '置顶';
            pin.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 16v4"/></svg>';
            const more = document.createElement('span');
            more.className = 'chat-more';
            more.textContent = '×';
            more.dataset.action = 'delete';
            item.appendChild(t);
            item.appendChild(pin);
            item.appendChild(more);
            group.appendChild(item);
          });
          historyList.appendChild(group);
        });
      }

      function getConv(id) {

      function newConversation() {
        if (abortController) { abortController.abort(); abortController = null; }
        const conv = {
          id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
          title: '新对话',
          messages: [],
          updatedAt: Date.now(),
          pinned: false
        };
        conversations.push(conv);
        saveConversations();
        currentId = conv.id;
        renderHistory();
        messages.innerHTML = '';
        messages.style.display = 'none';
        welcome.style.display = 'flex';
        prompt.value = '';
        sendBtn.disabled = true;
        switchSandbox(conv.id);
        updateChatHeader();
        if (modeBeast.classList.contains('active')) renderFilePanel();
        toggleSidebar(false);
      }

      function loadConversation(id) {
        if (abortController) { abortController.abort(); abortController = null; }
        const conv = getConv(id);
        if (!conv) return;
        currentId = id;
        welcome.style.display = 'none';
        messages.style.display = 'flex';
        messages.innerHTML = '';
        conv.messages.forEach((m, i) => appendMessage(m, i));
        chatCenter.scrollTop = chatCenter.scrollHeight;
        sendBtn.disabled = !(prompt.value.trim());
        renderHistory();
        updateChatHeader();
        switchSandbox(id);
      }

      function appendMessage(m, i) {
        if (m.role === 'user') {
          const wrap = document.createElement('div');
          wrap.className = 'msg user';
          wrap.innerHTML = '<div class="user-bubble"></div>';
          wrap.querySelector('.user-bubble').textContent = m.content;
          messages.appendChild(wrap);
          return;
        }
        const wrap = document.createElement('div');
        wrap.className = 'msg ai';
        wrap.innerHTML = '<div class="ai-body"></div><div class="ai-actions"></div>';
        const body = wrap.querySelector('.ai-body');
        if (m.reasoning) {
          body.appendChild(createReasoningBox(m.reasoning, false));
        }
        const content = document.createElement('div');
        content.className = 'ai-content';
        content.innerHTML = renderMarkdown(m.content || '');
        body.appendChild(content);
        if (m.toolCalls && m.toolCalls.length > 0) {
          m.toolCalls.forEach(tc => {
            if (tc.type === 'create' && tc.path) {
              const bar = createFileStatusBar(tc.path, 'done', tc.content ? new Blob([tc.content]).size : 0);
              bar.classList.add('done');
              body.appendChild(bar);
            }
          });
        }
        wrap.querySelector('.ai-actions').appendChild(createAiActions());
        wrap.querySelector('.ai-actions').dataset.turn = i;
        messages.appendChild(wrap);
      }

      function createReasoningBox(reasoning, collapsed) {
        const box = document.createElement('div');
        box.className = 'reasoning-box' + (collapsed ? ' collapsed' : '');
        box.innerHTML = `
          <div class="reasoning-header">
            <svg class="reasoning-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="reasoning-text">已思考</span>
            <svg class="reasoning-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </div>
          <div class="reasoning-body"></div>
        `;
        box.querySelector('.reasoning-body').textContent = reasoning;
        return box;
      }

      historyList.addEventListener('click', (e) => {
        const delBtn = e.target.closest('.chat-more[data-action="delete"]');
        if (delBtn) {
          const item = delBtn.closest('.chat-item');
          if (!item) return;
          const id = item.dataset.id;
          conversations = conversations.filter(c => c.id !== id);
          saveConversations();
          if (currentId === id) {
            messages.innerHTML = '';
            messages.style.display = 'none';
            welcome.style.display = 'flex';
            currentId = null;
          }
          renderHistory();
          return;
        }
        const pinBtn = e.target.closest('.chat-pin[data-action="pin"]');
        if (pinBtn) {
          const pItem = pinBtn.closest('.chat-item');
          if (!pItem) return;
          const pConv = getConv(pItem.dataset.id);
          if (!pConv) return;
          pConv.pinned = !pConv.pinned;
          saveConversations();
          renderHistory();
          toast(pConv.pinned ? '已置顶' : '已取消置顶');
          return;
        }
        const item = e.target.closest('.chat-item');
        if (!item) return;
        loadConversation(item.dataset.id);
        toggleSidebar(false);
      });
      historyList.addEventListener('contextmenu', (e) => {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        e.preventDefault();
        const conv = getConv(item.dataset.id);
        if (!conv) return;
        conv.pinned = !conv.pinned;
        saveConversations();
        renderHistory();
        toast(conv.pinned ? '已置顶' : '已取消置顶');
      });

      messages.addEventListener('click', (e) => {
        const reasoningHeader = e.target.closest('.reasoning-header');
        if (reasoningHeader) {
          reasoningHeader.closest('.reasoning-box').classList.toggle('collapsed');
          return;
        }
        const btn = e.target.closest('.ai-action');
        if (!btn) return;
        const action = btn.dataset.action;
        const aiMsg = btn.closest('.msg.ai');
        const contentEl = aiMsg ? aiMsg.querySelector('.ai-content') : null;
        const text = contentEl ? contentEl.textContent : '';
        if (action === 'copy') {
          navigator.clipboard.writeText(text).then(() => {
            btn.style.color = 'var(--brand)';
            setTimeout(() => btn.style.color = '', 1200);
          }).catch(() => {});
        } else if (action === 'regenerate') {
          const conv = getConv(currentId);
          if (!conv) return;
          const turn = parseInt(btn.closest('.ai-actions').dataset.turn);
          if (isNaN(turn)) return;
          const userIdx = turn - 1;
          if (userIdx < 0 || turn >= conv.messages.length) return;
          if (conv.messages[turn].role !== 'assistant' || conv.messages[userIdx].role !== 'user') return;
          // 删掉该条助手回复及其之后的所有消息，保留用户提问
          conv.messages.splice(turn);
          saveConversations();
          loadConversation(currentId);
          callAi(conv);
        } else if (action === 'like') {
          btn.style.color = '#4ade80';
          const turn = btn.closest('.ai-actions')?.dataset.turn;
          if (turn) localStorage.setItem('gooseai_feedback_' + currentId + '_' + turn, 'like');
        } else if (action === 'dislike') {
          btn.style.color = '#ef4444';
          const turn = btn.closest('.ai-actions')?.dataset.turn;
          if (turn) localStorage.setItem('gooseai_feedback_' + currentId + '_' + turn, 'dislike');
        } else if (action === 'speak') {
          (function() {
            const msg = btn.closest('.msg');
            const content = msg ? msg.querySelector('.ai-content') : null;
            const text = content ? content.textContent.trim() : '';
            if (!text) return;
            if ('speechSynthesis' in window) {
              if (speechSynthesis.speaking) speechSynthesis.cancel();
              const utter = new SpeechSynthesisUtterance(text);
              utter.lang = 'zh-CN';
              utter.rate = 1;
              // 用系统自带中文语音（Yaoyao / Yunxi / Tingting 等，效果远好于 ResponsiveVoice 中文）
              var voices = speechSynthesis.getVoices();
              if (voices.length === 0) {
                speechSynthesis.addEventListener('voiceschanged', function() {
                  var v = speechSynthesis.getVoices().find(function(v) { return v.lang.startsWith('zh'); });
                  if (v) utter.voice = v;
                  speechSynthesis.speak(utter);
                }, { once: true });
              } else {
                var zh = voices.find(function(v) { return v.lang.startsWith('zh'); });
                if (zh) utter.voice = zh;
                speechSynthesis.speak(utter);
              }
              // 原生失败时 fallback 到 ResponsiveVoice
              utter.onerror = function() {
                if (typeof responsiveVoice !== 'undefined')
                  responsiveVoice.speak(text, 'Chinese Male', { rate: 1 });
              };
            } else if (typeof responsiveVoice !== 'undefined') {
              responsiveVoice.speak(text, 'Chinese Male', { rate: 1 });
            }
          })();
        }

      });

      function resetChat() {
        newConversation();
      }

      modeNormal.addEventListener('click', () => {
        if (modeNormal.classList.contains('active')) return;
        modeNormal.classList.add('active');
        modeBeast.classList.remove('active');
        modeImage.classList.remove('active');
        modeVideo.classList.remove('active');
